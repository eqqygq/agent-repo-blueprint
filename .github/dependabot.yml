version: 2
updates:
  # 按实际技术栈选择 package-ecosystem：npm / pip / maven / gradle / nuget / gomod / cargo ...
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions 自身也要更新，且第三方 Action 应固定到 commit SHA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
