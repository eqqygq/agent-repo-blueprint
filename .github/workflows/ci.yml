name: CI

on:
  pull_request:
  push:
    branches: [main]

# 默认最小权限；各 job 按需单独提权
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: 安装 PyYAML（供 YAML 语法检查）
        run: python -m pip install --quiet pyyaml

      - name: 仓库体检（本地与 CI 同一套脚本）
        run: bash scripts/verify.sh

      # TODO: 技术栈确定后在这里加 lint / test / build，
      # 并把本 job 设为 ruleset 的必需 status check。
